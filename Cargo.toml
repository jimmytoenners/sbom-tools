[workspace]
members = [".", "crates/sbom-tools-ffi"]
exclude = ["dagger/rust-sdk"]

[package]
name = "sbom-tools"
version = "0.1.21"
edition = "2024"
rust-version = "1.88"
description = "Semantic SBOM diff and analysis tool"
license = "MIT"
readme = "README.md"
repository = "https://github.com/sbom-tool/sbom-tools"
keywords = ["sbom", "cyclonedx", "spdx", "diff", "security"]
categories = ["command-line-utilities", "development-tools", "security"]

[lib]
name = "sbom_tools"
crate-type = ["rlib"]

[dependencies]
# Signal Handling
ctrlc = "3.5"

# SBOM Parsing
spdx = "0.13"

# Diff Algorithm
pathfinding = "4"

# Fuzzy Matching
strsim = "0.11"
semver = { version = "1.0", features = ["serde"] }
regex = "1.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
quick-xml = { version = "0.40", features = ["serialize"] }

# TUI (ratatui ecosystem)
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.29"

# CLI
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
clap_mangen = "0.3"

# HTTP Client for enrichment
reqwest = { version = "0.13", features = ["blocking", "json", "rustls"], default-features = false, optional = true }
sha2 = "0.11"

# OCI registry client (feature-gated). Wraps the registry HTTP dance —
# manifest pulls, blob pulls, bearer-token auth, Referrers API.
oci-client = { version = "0.15", default-features = false, features = ["rustls-tls"], optional = true }
# Current-thread async runtime used at the OCI boundary only; everywhere
# else in the codebase stays synchronous. `time` + `net` are needed for
# `Builder::enable_all()` (IO + timer drivers); `fs` + `io-util` give us
# `tokio::fs::File` + `AsyncWriteExt` for the blob writes.
tokio = { version = "1", features = ["rt", "time", "net", "fs", "io-util"], optional = true }
# Base64 decoder for DSSE envelope payloads (in-toto Statement unwrap).
base64 = { version = "0.22", optional = true }
# Sigstore — cosign signature + DSSE envelope verification, Fulcio keyless,
# Rekor transparency-log inclusion. Pre-1.0 with churn risk; pinned exactly.
sigstore = { version = "0.13", default-features = false, features = ["cosign", "sigstore-trust-root"], optional = true }
# X.509 cert parsing for keyless attestation verification. Sigstore-rs uses
# this transitively at 0.2.x; adding it directly so we can extract SAN +
# the Fulcio OIDC-issuer extension from per-attestation ephemeral certs.
x509-cert = { version = "0.2", default-features = false, features = ["pem", "std"], optional = true }

# Utilities
chrono = { version = "0.4.44", features = ["serde"] }
rayon = "1.12"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
indexmap = { version = "2.14", features = ["serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
dirs = "6.0.0"
unicode-width = "0.2"
schemars = "1.2"

[features]
default = ["enrichment"]
enrichment = ["reqwest"]
# OCI registry ingestion + cosign verification. Off by default.
# Currently pulls in the registry-fetch deps (oci-client + tokio);
# cosign verification (sigstore) lands in a follow-up commit — see
# docs/oci-verify-plan.md.
oci = ["dep:oci-client", "dep:tokio", "dep:base64", "dep:sigstore", "dep:x509-cert"]
ffi = []

[dev-dependencies]
criterion = "0.8"
proptest = "1.11"
tempfile = "3.27"

[[bench]]
name = "diff_benchmark"
harness = false

[[bench]]
name = "large_sbom"
harness = false

[[test]]
name = "ffi_bindings"
required-features = ["ffi"]

[[test]]
name = "ffi_schema_snapshots"
required-features = ["ffi"]

[[test]]
name = "conformance_ffi"
required-features = ["ffi"]

[[test]]
name = "ffi_regression"
required-features = ["ffi"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[profile.release]
lto = true
codegen-units = 1
